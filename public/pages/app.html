<html>

<head>
    <title>Rotulo</title>
</head>

<body onload="loadApp()">
    <h1>Rotulo</h1>
    <p id="welcome-text">Welcome!</p>
    <p id="loading-text">Loading songs ...</p>

    <p>Songs</p>
    <ul id="songs-list"></ul>

    <p>Playlists</p>
    <ul id="playlists-list"></ul>

    <p>Tags</p>
    <ul id="tags-list"></ul>
    <br>
    <a href="/logout">logout</a>

    <script>
        const statusText = document.getElementById("loading-text");

        async function loadApp() {
            statusText.innerHTML = "Fetching songs and playlists";
            const [songs, playlists] = await fetchSongs();

            statusText.innerHTML = "Creating tags";
            const songsWithTags = await createTags(songs, playlists);

            statusText.innerHTML = "Filling lists";
            await createList(songs, playlists, songsWithTags);

            statusText.innerHTML = "Creating tag colors";
            await createSchema(playlists);

            statusText.innerHTML = "Succes!";
        }

        async function fetchSongs() {
            const songsList = document.getElementById("songs-list");

            const response = await fetch("/api/data", {
                method: 'GET'
            });

            if (response.ok) {
                try {
                    const data = await response.json();
                    if (data.success) {
                        const welcomeText = document.getElementById("welcome-text");
                        welcomeText.innerHTML = `Welcome! You are logged in as ${data.data.profile.display_name}`;

                        return [data.data.songs, data.data.playlists];
                    } else {
                        console.log("Data was retrieved but the server repsonded with an error");
                        return;
                    }
                } catch (err) {
                    console.log("Error unpacking fetched data: " + err);
                    return;
                }
            } else {
                console.log("Data responded with status: " + response.status);
                return;
            }
        }

        async function createTags(songs, playlists) {
            let withTags = songs.map(song => {
                return {
                    id: song.id,
                    title: song.title,
                    artist: song.artist,
                    tags: []
                }
            });

            playlists.forEach(playlist => {
                playlist.songs.forEach(song => {
                    if (withTags[song]) {
                        withTags[song].tags.push(playlist);
                    }
                })
            });

            return withTags;
        }

        async function createList(songs, playlists, songsWithTags) {
            // Only songs
            const songsList = document.getElementById("songs-list");
            songs.forEach(element => {
                const song = document.createElement("li");
                song.innerHTML = `${element.id} | ${element.title} | ${element.artist}`;
                songsList.append(song);
            });

            // Only playlists
            const playlistsList = document.getElementById("playlists-list");
            playlists.forEach(element => {
                const playlist = document.createElement("li");
                playlist.innerHTML = `${element.id} | ${element.title} | by you`;
                playlistsList.append(playlist);
            });

            // Songs with tags
            const tagsList = document.getElementById("tags-list");
            songsWithTags.forEach(element => {
                const tagElement = document.createElement("li");
                const infoSpan = document.createElement("span");

                infoSpan.innerHTML = `${element.id} | ${element.title} | ${element.artist}`;
                tagElement.appendChild(infoSpan);

                element.tags.forEach(tag => {
                    const tagsSpan = document.createElement("tag");
                    tagsSpan.setAttribute("spotify-id", tag.id);

                    tagsSpan.addEventListener("click", () => {
                        console.log(tag.id);
                    });

                    tagElement.appendChild(tagsSpan);
                });

                tagsList.appendChild(tagElement);
            });
        }

        async function createSchema(playlists) {
            let styleElement = document.createElement("style");
            styleElement.type = 'text/css'

            let styleText = "";
            playlists.forEach(playlist => {
                styleText += `
                        tag[spotify-id="${playlist.id}"]::after {
                            content: "${playlist.title}";
                            margin-left: 5px;
                            background-color: red;
                        }
                    `;
            });

            if (styleElement.styleSheet) {
                styleElement.styleSheet.cssText = styleText;
            } else {
                styleElement.appendChild(document.createTextNode(styleText));
            }

            document.head.appendChild(styleElement);
        }
    
        const delay = (delayInms) => {
            return new Promise(resolve => setTimeout(resolve, delayInms));
        };
    </script>
</body>

</html>
