<html>

<head>
    <title>Rotulo</title>
    <style type="text/css">
        html,
        body {
            margin: 0px;
            padding: 0px;
        }

        #welcome {
            height: 20%;
            width: 100%;
            position: fixed;
            top: 0;
        }

        #songs-list {
            height: 80%;
            margin: 0px;
            padding: 0px;
            width: 50%;
            position: fixed;
            top: 20%;
            left: 0px;
            overflow-y: scroll;
        }

        #playlists-list {
            margin: 0px;
            padding: 0px;
            height: 80%;
            width: 50%;
            right: 0px;
            position: fixed;
            top: 20%;
            overflow-y: scroll;
        }

        .playlist::after {
            display: inline-block;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
        }

        /* li.playlist {
            background-color: red;
        }

        li.playlist.included {
            background-color: green;
        } */
    </style>
</head>

<body>
    <div id="welcome">
        <h1>Rotulo</h1>
        <span id="welcome-text">Welcome!</span>
        <br>
        <a href="/logout">logout</a>
        <button onclick="loadPlaylists()">Load playlists</button>
        <button onclick="loadSongs()">Load songs</button>
    </div>

    <ol id="playlists-list"></ol>

    <ol id="songs-list"></ol>

    <script>
        const playlistsList = document.getElementById("playlists-list");
        const songsList = document.getElementById("songs-list");

        async function loadPlaylists() {
            const res = await fetch("/api/playlists", {
                method: 'GET'
            });

            const data = await res.json();
            createSchema(data);

            data.forEach((playlist) => {
                const child = document.createElement("li");
                child.classList.add("playlist");

                child.addEventListener('click', function () {
                    child.classList.toggle("included");
                })

                // child.innerHTML = `<b>${playlist.title}</b> - ${playlist.owner}`;
                child.setAttribute("playlist-id", playlist.id);
                playlistsList.appendChild(child);
            });
        }

        async function loadSongs() {
            const included = [...document.querySelectorAll(".playlist.included")];
            console.log(included);
            const includedIds = included.map((playlist) => { return playlist.getAttribute("playlist-id"); })
            console.log(includedIds)

            const response = await fetch("/api/songs", {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
                body: JSON.stringify(includedIds),
            });

            if (response.ok) {
                songsList.innerHTML = "";
                const data = await response.json();

                for(const key in data) {
                    const song = data[key];
                    const child = document.createElement("li");
                    child.innerHTML = `<b>${song.name}</b> by ${song.artist} | ${song.tags.map(e => { return `<span playlist-id="${e}"></span>`; }).join("")}`;
                    child.setAttribute("spotify-id", key);
                    songsList.appendChild(child);
                };
            } else {
                console.log("Data responded with status: " + response.status);
                return;
            }
        }

        // Create a CSS element that styles the tags and the playlist buttons, it takes a list of objects containing
        // the playlists id and name, then for each element in the page that has the attribute playlist-id it 
        // will add proper styling and will add the name of the playlist to the element using ::after
        async function createSchema(playlists) {
            // Create CSS object
            let styleElement = document.createElement("style");
            styleElement.type = 'text/css'
            let styleText = "";

            playlists.forEach(playlist => {
                styleText += `
                        li[playlist-id="${playlist.id}"]::after {
                            background-color: #ddd;
                            content: "${playlist.title}";
                        }

                        li.included[playlist-id="${playlist.id}"]::after {
                            background-color: green;
                            color: white;
                            content: "${playlist.title} x";
                        }

                        span[playlist-id="${playlist.id}"]::after {
                            content: "${playlist.title}";
                        }
                    `;
            });

            // Add the styling to the page
            if (styleElement.styleSheet) {
                styleElement.styleSheet.cssText = styleText;
            } else {
                styleElement.appendChild(document.createTextNode(styleText));
            }
            document.head.appendChild(styleElement);
        }

        function stringHashToHex(str) {
            let hash = 0;

            for (var i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
                hash = hash & hash;
            }
            var color = '#';
            for (var i = 0; i < 3; i++) {
                var value = (hash >> (i * 8)) & 255;
                color += ('00' + value.toString(16)).substr(-2);
            }
        }
    </script>
</body>

</html>
