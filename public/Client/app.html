<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tracks</title>
    <link rel="icon" type="image/x-icon" href="/Style/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/Style/main.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg border-bottom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <svg width="30" height="30" viewBox="0 0 100 100">
                    <circle cx="45" cy="50" r="35" fill="#fff" stroke="#ccc" stroke-width="10" />
                    <circle cx="45" cy="50" r="20" fill="#ccc" />
                    <rect x="40" y="32" width="60" height="68" rx="15" fill="white" />
                    <line x1="55" y1="50" x2="85" y2="50" stroke="#e62802" stroke-width="15" stroke-linecap="round" />
                    <line x1="55" y1="70" x2="85" y2="70" stroke="#ed5b3e" stroke-width="15" stroke-linecap="round" />
                    <line x1="55" y1="90" x2="85" y2="90" stroke="#ff8269" stroke-width="15" stroke-linecap="round" />

                </svg>
                <span class="ms-2">Rótulo</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav column-gap-3">
                    <li class="nav-item">
                        <a class="nav-link p-2 active" href="/">Tracks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link p-2" href="/playlists">Playlists</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto column-gap-3">
                    <li class="nav-item">
                        <a class="nav-link p-2" href="https://tikkie.me/pay/1h42fv76g7f06o6nlfq3">Donate</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link p-2" href="https://ronindevreezeut.github.io/portfolio/">About me</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                                class="bi bi-arrow-left-short" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5" />
                            </svg>
                            Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container-sm">
        <!-- Add playlist popup -->
        <div id="popup" class="card d-none card-body my-4">
            <!-- Add new tag -->
            <div class="input-group mb-3">
                <input id="popup-new-playlist-name" type="text" class="form-control" placeholder="Add new tag">
                <button class="btn btn-outline-secondary" type="button" onclick="createNewTag(event)">+</button>
            </div>

            <!-- Search for tags -->
            <input id="popup-playlist-search" type="text" class="form-control mb-3" placeholder="Search tags ...">

            <!-- List of existing tags -->
            <div id="popup-playlists" class="container d-inline-flex flex-wrap gap-1 p-0">
            </div>
        </div>

        <!-- Search box -->
        <div class="input-group mt-2 pb-5 d-flex flex-column flex-md-row gap-2">
            <!-- Searchbar -->
            <textarea rows="1" id="searchbar" class="form-control w-auto"
                placeholder="Filter tracks based on artist, tags and playlists ... "></textarea>

            <!-- Responsive buttons -->
            <div class="btn-group">
                <!-- Default play button and dropdown appending it -->
                <button onclick="playTracks()" type="button" class="btn px-5 btn-outline-secondary">Play</button>
                <button type="button" class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split"
                    data-bs-toggle="dropdown">
                </button>

                <!-- Buttons in the dropdown menu -->
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a onclick="addToQueue()" class="dropdown-item" href="#">Add to queue</a></li>
                    <li><a onclick="exportToPlaylist()" class="dropdown-item" href="#">Export to playlist</a></li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li><a onclick="saveFilter()" class="dropdown-item" href="#">Save this filter</a></li>
                    <li><a onclick="clearFilter()" class="dropdown-item" href="#">Remove filter</a></li>
                    <li><a onclick="clearSearch()" class="dropdown-item" href="#">Clear</a></li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li id="saved-filters">
                    </li>
                </ul>
            </div>
        </div>

        <!-- Table -->
        <table class="table" style="table-layout: fixed; width: 100%;">
            <!-- Header and column sizes -->
            <thead>
                <tr>
                    <th scope="col" class="col-3">Title</th>
                    <th scope="col" class="col-3">Artist</th>
                    <th scope="col" class="col-6">Tags</th>
                </tr>
            </thead>

            <!-- Content -->
            <tbody id="tracks-table">
            </tbody>
        </table>

        <!-- Footer -->
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
            <div class="col-md-4 d-flex align-items-center">
                <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1"></a>
                <span class="mb-3 mb-md-0 text-body-secondary">2025 | Ronin de Vreeze</span>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Client/dashboard.js"></script>
    <script src="/Client/search.js"></script>
</body>

</html>
